<!doctype html>
<html
  lang="ja"
  data-resolution="portrait"
  data-composition-variables='[
    {"id":"photo","type":"string","label":"Photo Path","default":""},
    {"id":"title","type":"string","label":"Card Title","default":""},
    {"id":"subtitle","type":"string","label":"Card Subtitle","default":""},
    {"id":"rarity","type":"string","label":"Rarity","default":""},
    {"id":"flavor","type":"string","label":"Flavor Text","default":""}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>SSRGenerate — 15s SSR Gacha Reveal</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --in-oklab: ;
        --bg-void: #040611;
      }

      @supports (background: linear-gradient(in oklab, white, black)) {
        :root {
          --in-oklab: in oklab;
        }
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--bg-void);
        -webkit-font-smoothing: antialiased;
      }

      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--bg-void);
        isolation: isolate;
      }

      .clip {
        position: absolute;
        inset: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        pointer-events: none;
      }

      #comp-summon {
        z-index: 10;
      }

      #comp-result {
        z-index: 20;
      }

      #flash-layer {
        z-index: 60;
        background: radial-gradient(circle at 50% 50% var(--in-oklab), #ffffff 0%, #fffbeb 55%, #fef08a 100%);
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="15"
      data-width="1080"
      data-height="1920"
    >
      <!-- =====================================================
           Audio Tracks (Procedural WAVs synced to 15.0s timeline)
           ===================================================== -->
      <audio
        id="audio-summon"
        src="assets/se_summon.wav"
        data-start="0"
        data-duration="3.5"
        data-volume="0.85"
        data-track-index="10"
      ></audio>
      <audio
        id="audio-upgrade"
        src="assets/se_upgrade.wav"
        data-start="2.5"
        data-duration="4.8"
        data-volume="0.92"
        data-track-index="11"
      ></audio>
      <audio
        id="audio-fanfare"
        src="assets/se_fanfare.wav"
        data-start="6.8"
        data-duration="8.0"
        data-volume="0.95"
        data-track-index="12"
      ></audio>

      <!-- =====================================================
           Sub-Composition 1: Summon Circle, Orb & Fake Upgrade (0.0s - 7.4s)
           ===================================================== -->
      <div
        id="comp-summon"
        class="clip"
        data-composition-id="scene-summon"
        data-composition-src="compositions/scene-summon.html"
        data-start="0"
        data-duration="7.4"
        data-track-index="0"
      ></div>

      <!-- =====================================================
           Sub-Composition 2: 3D SSR Card Reveal & Static Result (6.9s - 15.0s)
           ===================================================== -->
      <div
        id="comp-result"
        class="clip"
        data-composition-id="scene-result"
        data-composition-src="compositions/scene-result.html"
        data-start="6.9"
        data-duration="8.1"
        data-track-index="1"
      ></div>

      <!-- =====================================================
           Whiteout Flash Transition Layer (3.7s - 8.2s)
           ===================================================== -->
      <div id="flash-layer" class="clip" data-start="3.7" data-duration="4.5" data-track-index="2"></div>
    </div>

    <script>
      (function () {
        // Forward top-level CLI variables to scene-result sub-composition if provided
        const hfVars =
          window.__hyperframes && typeof window.__hyperframes.getVariables === "function"
            ? window.__hyperframes.getVariables()
            : {};
        const hasOverride = Object.keys(hfVars).some(function (k) {
          return typeof hfVars[k] === "string" && hfVars[k].trim() !== "";
        });
        if (hasOverride) {
          const resComp = document.getElementById("comp-result");
          if (resComp) {
            resComp.setAttribute("data-variable-values", JSON.stringify(hfVars));
          }
        }

        const tl = gsap.timeline({ paused: true });

        // Gold promotion flash (3.78s)
        tl.fromTo("#flash-layer", { opacity: 0 }, { opacity: 0.68, duration: 0.08, ease: "power2.out" }, 3.78);
        tl.to("#flash-layer", { opacity: 0, duration: 0.34, ease: "power2.in" }, 3.86);

        // Rainbow SSR promotion flash (5.18s)
        tl.fromTo("#flash-layer", { opacity: 0 }, { opacity: 0.88, duration: 0.08, immediateRender: false }, 5.18);
        tl.to("#flash-layer", { opacity: 0, duration: 0.35, ease: "power2.out" }, 5.26);

        // Critical whiteout transition (6.72s -> 7.86s)
        tl.fromTo("#flash-layer", { opacity: 0 }, { opacity: 1, duration: 0.28, ease: "power2.in", immediateRender: false }, 6.72);
        tl.to("#flash-layer", { opacity: 0, duration: 0.68, ease: "power2.out" }, 7.18);

        // Anchor 15.0s total duration
        tl.set("#root", {}, 15.0);

        window.__timelines = window.__timelines || {};
        window.__timelines["main"] = tl;
        tl.seek(0);
      })();
    </script>
  </body>
</html>
